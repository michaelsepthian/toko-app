# Untuk VPS dengan TLS/domain ditangani reverse proxy provider.
# Gunakan bersama compose.yaml. Port sama dengan stack Nginx VPS yang sudah ada.
services:
  frontend:
    image: ${FRONTEND_IMAGE:-toko-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 15s

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:80"
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
