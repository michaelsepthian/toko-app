name: toko

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toko}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env.docker}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Isi APP_DB_PASSWORD di .env.docker}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${DB_PORT_LOCAL:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./database/schema.sql:/schema/schema.sql:ro
      - ./database/migrations/20261101_tanggal_pendapatan.sql:/schema/tanggal_pendapatan.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${API_IMAGE:-toko-api:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Isi JWT_SECRET_BASE64 dengan kunci acak base64 minimal 32 byte}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PRODUCT_CACHE_TTL_SECONDS: ${PRODUCT_CACHE_TTL_SECONDS:-3600}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-toko}
      DB_USER: toko_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?Isi APP_DB_PASSWORD di .env.docker}
      DB_SSLMODE: disable
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
