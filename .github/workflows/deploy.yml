name: Deploy master to VPS

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/**'
      - 'deploy/**'
      - 'compose*.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a running database migration. New pushes queue for deployment.
concurrency:
  group: toko-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test deployment scripts
        run: |
          bash -n deploy/remote-update.sh deploy/auto-deploy.sh
          python3 -m unittest discover -s deploy/tests -v
      - name: Test Nginx routing and container updates
        run: python3 deploy/tests/nginx-proxy.py
      - name: Test migrations against PostgreSQL
        run: bash deploy/tests/migration-postgres.sh

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            suffix: api
          - component: frontend
            suffix: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse image when component content is unchanged
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
          SUFFIX: ${{ matrix.suffix }}
          REPOSITORY: ${{ github.repository }}
        run: |
          repository=${REPOSITORY,,}
          tree=$(git rev-parse "HEAD:$COMPONENT")
          image="ghcr.io/${repository}-${SUFFIX}:tree-${tree}-amd64"
          echo "tag=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Image tersedia, build dilewati: $image"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        if: steps.image.outputs.build == 'true'
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: NEXT_PUBLIC_API_BASE_URL=/api/v1
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: images
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy exact commit over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ $VPS_HOST =~ ^[a-zA-Z0-9.-]+$ && $VPS_USER =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ $VPS_APP_PATH =~ ^/[a-zA-Z0-9_./-]+$ ]]
          port=${VPS_PORT:-22}
          [[ $port =~ ^[0-9]+$ ]]
          key="$RUNNER_TEMP/toko-deploy-key"
          hosts="$RUNNER_TEMP/toko-known-hosts"
          trap 'rm -f -- "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hosts"
          repository=${REPOSITORY,,}
          ssh -i "$key" -p "$port" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$VPS_APP_PATH' '$COMMIT' '$repository'" < deploy/remote-update.sh
